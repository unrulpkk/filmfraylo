name: Build FilmFraylo Packages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            package: windows
          - runner: macos-15
            platform: macos-arm64
            package: mac
          - runner: macos-15-intel
            platform: macos-x64
            package: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$') { throw 'Use a tag such as v2.0.0 or v2.0.0-preview.1' }
          "appVersion=$version" >> $env:GITHUB_ENV
      - name: Prepare Windows installer compiler
        if: runner.os == 'Windows'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          curl.exe --fail --location --retry 3 --connect-timeout 20 --max-time 180 --output $archive 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') { throw 'NSIS checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'nsisCompiler'
          Expand-Archive -LiteralPath $archive -DestinationPath $compiler
          "NSIS_PATH=$(Join-Path $compiler 'nsis-3.11/makensis.exe')" >> $env:GITHUB_ENV
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Prepare Mac desktop dependencies
        if: runner.os == 'macOS'
        run: |
          if ('${{ matrix.platform }}' -eq 'macos-x64') { bun install --frozen-lockfile --cwd compat/macIntel }
          bun packages/startup/scripts/buildMac.ts
      - name: Build desktop package
        run: bun run package:desktopRelease
      - name: Build Windows EXE installer
        if: runner.os == 'Windows'
        run: bun apps/desktop/scripts/packageWindows.ts
      - name: Build optional Web package
        run: bun run package:${{ matrix.package }}
      - name: Build first-use Skills bundle
        if: runner.os == 'Windows'
        run: bun run package:skills
      - name: Prepare stable download names
        env:
          packagePlatform: ${{ matrix.platform }}
        run: |
          $extension = if ($env:RUNNER_OS -eq 'Windows') { 'zip' } else { 'dmg' }
          foreach ($mode in @('desktop', 'web')) {
            $packages = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match "^filmFraylo-$mode-\d.*-$($env:packagePlatform)\.$extension$" })
            if ($packages.Count -ne 1) { throw "Expected exactly one $mode platform package" }
            $stable = "dist/filmFraylo-$mode-$($env:packagePlatform).$extension"
            Copy-Item -LiteralPath $packages[0].FullName -Destination $stable
            $hash = (Get-FileHash -LiteralPath $stable -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $stable)" | Set-Content -LiteralPath "$stable.sha256" -Encoding utf8NoBOM
          }
      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            source/dist/*.zip
            source/dist/*.dmg
            source/dist/*.exe
      - name: Upload downloadable artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filmFraylo-${{ matrix.platform }}
          path: |
            source/dist/*.zip
            source/dist/*.dmg
            source/dist/*.exe
            source/dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect all platforms
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: filmFraylo-*
          path: release
          merge-multiple: true
      - name: Publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "FilmFraylo $GITHUB_REF_NAME" "${options[@]}"

  syncGitee:
    needs: release
    uses: ./.github/workflows/syncGiteeRelease.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
