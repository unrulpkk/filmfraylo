name: Build FilmFraylo Packages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            package: windows
          - runner: macos-15
            platform: macos-arm64
            package: mac
          - runner: macos-15-intel
            platform: macos-x64
            package: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$') { throw 'Use a tag such as v2.0.0 or v2.0.0-preview.1' }
          "appVersion=$version" >> $env:GITHUB_ENV
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build native package
        run: bun run package:${{ matrix.package }}
      - name: Build first-use Skills bundle
        if: runner.os == 'Windows'
        run: bun run package:skills
      - name: Prepare stable download names
        env:
          packagePlatform: ${{ matrix.platform }}
        run: |
          $extension = if ($env:RUNNER_OS -eq 'Windows') { 'zip' } else { 'dmg' }
          $packages = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match "^filmFraylo-\d.*-$($env:packagePlatform)\.$extension$" })
          if ($packages.Count -ne 1) { throw 'Expected exactly one platform package' }
          $stable = "dist/filmFraylo-$($env:packagePlatform).$extension"
          Copy-Item -LiteralPath $packages[0].FullName -Destination $stable
          $hash = (Get-FileHash -LiteralPath $stable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $stable)" | Set-Content -LiteralPath "$stable.sha256" -Encoding utf8NoBOM
      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
      - name: Upload downloadable artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filmFraylo-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect all platforms
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: filmFraylo-*
          path: release
          merge-multiple: true
      - name: Create one release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft --title "FilmFraylo $GITHUB_REF_NAME"
