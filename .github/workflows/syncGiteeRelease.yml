name: Sync FilmFraylo Release to Gitee

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag, for example v2.0.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: giteeRelease-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release sync tools and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Synchronize and verify release attachments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: fengshaochen/filmfraylo
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun scripts/syncGiteeRelease.ts
