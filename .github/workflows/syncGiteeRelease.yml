name: Sync FilmFraylo Release to Gitee

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag, for example v2.0.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: giteeRelease-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      assets: ${{ steps.release.outputs.assets }}
    steps:
      - name: Checkout release sync tools and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Prepare release and attachment jobs
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: fengshaochen/filmfraylo
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SYNC_MODE: prepare
        run: |
          bun scripts/syncGiteeRelease.ts | tee "$RUNNER_TEMP/giteeReleasePlan.log"
          printf 'assets=%s\n' "$(tail -n 1 "$RUNNER_TEMP/giteeReleasePlan.log")" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        asset: ${{ fromJSON(needs.prepare.outputs.assets) }}
    steps:
      - name: Checkout release sync tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Synchronize attachment and SHA256 file
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: fengshaochen/filmfraylo
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SYNC_MODE: asset
          RELEASE_ASSET: ${{ matrix.asset }}
        run: bun scripts/syncGiteeRelease.ts
